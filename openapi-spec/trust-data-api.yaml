      description: Get vc schema by ID.
      operationId: getVcSchema
      parameters:
        - name: vcSchemaPath
          in: path
          required: true
          schema:
            type: string
            maxLength: 2147483647
            minLength: 2
      responses:
        "200":
          description: |
            Returns a single vc schema.
            | Representation | Spec |
            |-|-|
            | SD-JWT | [VC Type Metadata](https://datatracker.ietf.org/doc/html/draft-ietf-oauth-sd-jwt-vc-09#name-sd-jwt-vc-type-metadata)|

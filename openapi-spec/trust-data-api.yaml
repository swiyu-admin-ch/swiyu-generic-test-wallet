    description: Returns statements of the Trust Protocol 2.0 from the datastore.
  - name: NonCompliantActor
    description: Returns most recent list of non compliant actors.
  - name: Trust Statement
    description: Returns Trust Statement VC entries from the datastore.
  - name: VC Schema
    description: Returns VC schema entries from the datastore.

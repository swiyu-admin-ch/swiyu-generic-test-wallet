<div class="container">
  <h1>Verification</h1>
  <div fxLayout="row" fxLayoutAlign="center center" class="content">
    <mat-card>
      <mat-card-title fxLayout.gt-xs="row" fxLayout.xs="column">
        <h3>Verify Credential</h3>
      </mat-card-title>
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>SD-JWT Credential</mat-label>
          <textarea
            matInput
            [ngModel]="credentialInput()"
            (ngModelChange)="credentialInput.set($event)"
            placeholder="Paste your SD-JWT credential here"
            rows="4"
          >
          </textarea>
        </mat-form-field>

        <app-deeplink-input
          [inputSignal]="sdJwt"
          (submitEvent)="onResolve($event)"
          (resetEvent)="onClear()"
          label="swiyu-verify://...
openid4vp://...
https://..."
        />

        <mat-accordion>
          <app-validation-panel
            [data]="credential()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="credential()?.error"
            panelTitle="Validating Credential"
          >
            <mat-list>
              <app-validation-item
                [data]="credential()?.sdjwt"
                [validData]="credential()?.sdjwt !== undefined"
                text="Credential is provided"
              />
              <app-validation-item
                [data]="credential()?.decodedHeader"
                [validData]="credential()?.decodedHeader !== undefined"
                text="Can decode SD-JWT header"
              />
              <app-validation-item
                [data]="credential()?.decodedPayload"
                [validData]="credential()?.decodedPayload !== undefined"
                text="Can decode SD-JWT payload"
              />
            </mat-list>
            <app-data-viewer
              title="Header"
              [data]="credential()?.decodedHeader"
            />
            <app-data-viewer
              title="Payload"
              [data]="credential()?.decodedPayload"
            />
          </app-validation-panel>

          <app-validation-panel
            [data]="deeplink()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="deeplink()?.error"
            panelTitle="Resolving Deeplink"
          >
            <mat-list>
              <app-validation-item
                [data]="deeplink()"
                [validData]="deeplink() !== undefined"
                text="Deeplink parsed successfully"
              />

              <app-validation-item
                [data]="deeplink()?.decoded?.['client_id']"
                [validData]="deeplink()?.decoded?.['client_id'] !== undefined"
                text="Client ID present"
              />
              <app-validation-item
                [data]="deeplink()?.requestUri"
                [validData]="deeplink()?.decoded?.request_uri !== undefined"
                text="Request URI present"
              />
            </mat-list>
            <app-data-viewer title="Deeplink" [data]="deeplink()" />
          </app-validation-panel>

          <app-validation-panel
            [data]="requestObject()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="requestObject()?.error"
            panelTitle="Resolving Request Object"
          >
            <mat-list>
              <app-validation-item
                [data]="requestObject()"
                [validData]="requestObject() !== undefined"
                text="Can resolve request object"
              />
              <app-validation-item
                [data]="requestObject()?.parsed?.client_id"
                [validData]="requestObject()?.parsed?.client_id !== undefined"
                text="Client ID present?"
              />
              <app-validation-item
                [data]="requestObject()?.parsed?.nonce"
                [validData]="requestObject()?.parsed?.nonce !== undefined"
                text="Nonce present?"
              />
              <app-validation-item
                [data]="requestObject()?.parsed?.response_uri"
                [validData]="requestObject()?.parsed?.response_uri !== undefined"
                text="Response URI present?"
              />
              <app-validation-item
                [data]="requestObject()?.parsed?.dcql_query"
                [validData]="requestObject()?.parsed?.dcql_query !== undefined"
                text="DCQL Query present?"
              />
              <app-validation-item
                [data]="requestObject()?.response"
                [validData]="typeof requestObject()?.response === 'string'"
                text="Request object received as signed JWT"
                optional="This is optional because verifiers may return a JSON request object"
              />
            </mat-list>
            @if (typeof requestObject()?.response === 'string') {
            <app-data-viewer
              title="Raw request object"
              [data]="requestObject()?.response"
              [maxLength]="256"
            />
            }
            <app-data-viewer
              title="Request object"
              [data]="requestObject()?.parsed"
            />
          </app-validation-panel>

          <app-validation-panel
            [data]="trustStatements()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="dcql()?.error"
            panelTitle="Check Trust Statements"
          >
            <mat-list>
              <app-validation-item
                [data]="trustStatements()"
                [validData]="trustStatements()?.idTS !== undefined"
                text="Contains idTS"
              />
              <app-validation-item
                [data]="trustStatements()"
                [validData]="trustStatements()?.idTSDecoded?.sub !== undefined && trustStatements()?.idTSDecoded?.sub === requestObject()?.client_id"
                text="JAR client_id matches idTS sub claim"
              />
              <app-validation-item
                [data]="trustStatements()"
                [validData]="trustStatements()?.markers?.compliantActorTrustMarker === true"
                text="Is compliant actor"
              />
              <app-validation-item
                [data]="trustStatements()"
                [validData]="trustStatements()?.vqPS !== undefined"
                text="Contains vqPS"
              />
            </mat-list>
            <app-data-viewer
              title="Verifier info"
              [data]="trustStatements()?.idTS"
            />
            <app-data-viewer
              title="Decoded idTS"
              [data]="trustStatements()?.idTSDecoded"
            />
            <app-data-viewer
              title="Decoded vqPS"
              [data]="trustStatements()?.vqPSDecoded"
            />
            <app-data-viewer
              title="Decoded ncTLS"
              [data]="trustStatements()?.ncTLSDecoded"
            />
          </app-validation-panel>

          <app-validation-panel
            [data]="dcql()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="dcql()?.error"
            panelTitle="DCQL Query"
          >
            <mat-list>
              <app-validation-item
                [data]="trustStatements()"
                [validData]="requestObject()?.scope !== undefined"
                text="Does JAR contains scope?"
              />
              <app-validation-item
                [data]="dcql()?.query"
                [validData]="dcql()?.query !== undefined"
                [text]="`DCQL query from ${requestObject()?.scope !== undefined ? 'vqPS' : 'dcql_query'} present`"
              />
              <app-validation-item
                [data]="dcql()?.query?.credentials"
                [validData]="(dcql()?.query?.credentials?.length ?? 0) > 0"
                text="Credentials present and not empty"
              />
            </mat-list>
            <app-data-viewer title="DCQL query" [data]="dcql()?.query" />
          </app-validation-panel>

          <app-validation-panel
            [data]="requiredCredentials()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="requiredCredentialsError()"
            panelTitle="Required Credentials from DCQL"
          >
            <mat-list>
              <app-validation-item
                [data]="requiredCredentials()"
                [validData]="(requiredCredentials()?.length ?? 0) > 0"
                text="Credentials extracted from DCQL query"
              />
            </mat-list>
            @for (credential of requiredCredentials(); track $index) {
            <app-data-viewer
              [title]="`Required credential (${credential.id})`"
              [data]="credential"
            />
            } @empty { Cannot be retrieved }
          </app-validation-panel>

          <app-validation-panel
            [data]="payloadEncryption()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="payloadEncryptionError()"
            panelTitle="Payload Encryption Status"
          >
            <mat-list>
              @if (payloadEncryption()?.required === true) {
              <app-validation-item
                [data]="payloadEncryption()?.responseMode"
                [validData]="payloadEncryption()?.responseMode === 'direct_post.jwt'"
                text="Payload encryption is required as response mode is direct_post.jwt"
              />
              <app-validation-item
                [data]="payloadEncryption()?.jwks"
                [validData]="payloadEncryption()?.jwks !== undefined"
                text="Encryption JWKs available"
              />
              <app-validation-item
                [data]="payloadEncryption()?.encValuesSupported"
                [validData]="(payloadEncryption()?.encValuesSupported?.length ?? 0) > 0"
                text="Encryption methods supported"
              />
              } @else {
              <app-validation-item
                [data]="payloadEncryption()?.responseMode"
                [validData]="payloadEncryption()?.responseMode === 'direct_post'"
                text="Payload encryption is not required as response mode is direct_post"
              />
              }
            </mat-list>
            <app-data-viewer
              title="Payload encryption"
              [data]="payloadEncryption()"
            />
          </app-validation-panel>

          <app-validation-panel
            [data]="token()"
            [panelOpenState]="panelOpenState"
            [errorMessage]="token()?.error"
            panelTitle="Verifiable Presentation Token"
          >
            <mat-list>
              <app-validation-item
                [data]="token()?.token"
                [validData]="token()?.token !== undefined"
                text="VP Token created"
              />
            </mat-list>
            <app-data-viewer title="VP token" [data]="token()?.token" />
          </app-validation-panel>

          <app-validation-panel
            [data]="verification()?.submitted === true ? verification()?.submitted : undefined"
            [panelOpenState]="panelOpenState"
            [errorMessage]="verification()?.error"
            panelTitle="Verification Response Status"
          >
            <mat-list>
              <app-validation-item
                [data]="verification()?.submitted"
                [validData]="verification()?.submitted === true"
                text="Verification response submitted to verifier"
              />
            </mat-list>
            <app-data-viewer
              title="Verifier response"
              [data]="verification()?.response"
            />
          </app-validation-panel>
        </mat-accordion>
      </mat-card-content>
    </mat-card>
  </div>
</div>
